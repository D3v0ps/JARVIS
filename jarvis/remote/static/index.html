<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* The same palette as the desk's arc-reactor HUD: idle blue, listening cyan,
     thinking amber, speaking teal, on near-black. */
  :root {
    --bg: #05080c;
    --panel: rgba(18, 30, 40, 0.62);
    --edge: rgba(41, 182, 246, 0.22);
    --ink: #d8ecf7;
    --dim: #6f8494;
    --idle: #1b6fa8;
    --listening: #29b6f6;
    --thinking: #ffb300;
    --speaking: #3ee0c8;
    --paused: #5c6670;
    --bad: #ff6f60;
    --accent: var(--idle);
    --tap: 46vw;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(41,182,246,0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    font: 16px/1.45 "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px);
    overflow: hidden; overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 2px 6px; letter-spacing: 0.38em; font-size: 13px;
    text-transform: uppercase; color: var(--dim);
  }
  header b { color: var(--ink); font-weight: 600; letter-spacing: 0.42em; }
  .link { display: flex; align-items: center; gap: 7px; letter-spacing: 0.12em; font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); transition: background .3s; }
  .dot.on { background: var(--speaking); box-shadow: 0 0 10px var(--speaking); }

  main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

  /* --- the ring ------------------------------------------------------------ */
  .ring-wrap { display: flex; flex-direction: column; align-items: center; padding: 6px 0 2px; }
  .ring { width: 172px; height: 172px; display: block; }
  .ring .coil, .ring .sweep { transform-origin: 50% 50%; }
  .ring .core, .ring .bloom { transition: opacity .35s ease, r .35s ease; }
  .ring .sweep { opacity: 0; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { opacity: .42 } 50% { opacity: .78 } }
  @keyframes corebeat { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
  /* a wave leaving the core, which is what a voice looks like */
  @keyframes outward {
    0%   { r: 8;  opacity: .55; }
    100% { r: 37; opacity: 0; }
  }

  /* idle: dim, breathing, almost still */
  body[data-state="idle"] .coil  { animation: spin 60s linear infinite; opacity: .5; }
  body[data-state="idle"] .halo  { animation: breathe 4.5s ease-in-out infinite; }
  body[data-state="idle"] .core  { opacity: .6; }
  body[data-state="idle"] .bloom { opacity: .5; }

  /* listening: bright and awake */
  body[data-state="listening"] .coil { animation: spin 26s linear infinite; opacity: 1; }
  body[data-state="listening"] .halo { opacity: .85; }
  body[data-state="listening"] .core { animation: corebeat 1.4s ease-in-out infinite; }

  /* working: a comet sweeping the ring */
  body[data-state="thinking"] .coil  { animation: spin 9s linear infinite; opacity: .55; }
  body[data-state="thinking"] .sweep { opacity: 1; animation: spin 1.1s linear infinite; }
  body[data-state="thinking"] .halo  { opacity: .7; }

  /* speaking: waves leaving the core */
  body[data-state="speaking"] .coil  { animation: spin 40s linear infinite reverse; opacity: .95; }
  body[data-state="speaking"] .wave  { animation: outward 1.5s ease-out infinite; }
  body[data-state="speaking"] .core  { animation: corebeat .9s ease-in-out infinite; }
  body[data-state="speaking"] .halo  { animation: breathe 1.4s ease-in-out infinite; }

  .caption { margin-top: 8px; font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--accent); }
  .note { min-height: 18px; margin-top: 4px; font-size: 13px; color: var(--dim); text-align: center; }

  /* --- the exchanges -------------------------------------------------------- */
  #log {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin: 10px 0 4px; padding: 2px; display: flex; flex-direction: column; gap: 8px;
  }
  .line { padding: 10px 13px; border-radius: 14px; max-width: 86%; font-size: 15px; }
  .line.you { align-self: flex-end; background: rgba(41,182,246,0.14); border: 1px solid var(--edge); }
  .line.him { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.05); }
  .line.err { align-self: center; background: rgba(255,111,96,0.13); color: #ffd9d4; border: 1px solid rgba(255,111,96,0.3); font-size: 14px; }

  /* --- routines ------------------------------------------------------------- */
  #routines { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  #routines::-webkit-scrollbar { display: none; }
  #routines button {
    flex: 0 0 auto; min-height: 52px; padding: 0 20px; border-radius: 26px;
    background: var(--panel); border: 1px solid var(--edge); color: var(--ink);
    font-size: 15px; letter-spacing: 0.04em;
  }
  #routines button:active { background: rgba(41,182,246,0.22); }

  .ghost {
    align-self: flex-end; margin: 0 4px 2px; padding: 6px 10px; background: none;
    border: 0; color: var(--dim); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .ghost[hidden] { display: none; }

  /* --- the button ----------------------------------------------------------- */
  .talk-wrap { display: flex; justify-content: center; padding: 6px 0 2px; }
  #talk {
    width: var(--tap); height: var(--tap); max-width: 190px; max-height: 190px;
    min-width: 132px; min-height: 132px; border-radius: 50%;
    border: 2px solid var(--accent); background: radial-gradient(circle at 50% 40%, rgba(41,182,246,0.20), rgba(8,14,20,0.9));
    color: var(--ink); font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;
    box-shadow: 0 0 34px -8px var(--accent); transition: transform .12s ease, box-shadow .3s ease;
  }
  #talk:active { transform: scale(0.96); }
  #talk[data-armed="1"] { box-shadow: 0 0 60px -6px var(--listening); background: radial-gradient(circle at 50% 40%, rgba(41,182,246,0.42), rgba(8,14,20,0.9)); }
  #talk:disabled { opacity: .45; }

  /* --- pairing -------------------------------------------------------------- */
  #pair {
    position: fixed; inset: 0; background: rgba(3,6,9,0.96); z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
  }
  #pair[hidden] { display: none; }
  #pair h1 { font-size: 15px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0; }
  #pair input {
    width: 100%; max-width: 280px; padding: 16px; border-radius: 14px; text-align: center;
    background: var(--panel); border: 1px solid var(--edge); color: var(--ink);
  }
  #code { font-size: 34px; letter-spacing: 0.4em; }
  #pair button {
    width: 100%; max-width: 280px; padding: 16px; border-radius: 14px; border: 1px solid var(--edge);
    background: rgba(41,182,246,0.18); color: var(--ink); font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  #pairNote { min-height: 20px; font-size: 14px; color: var(--bad); text-align: center; }
  .hint { font-size: 13px; color: var(--dim); text-align: center; max-width: 300px; }
</style>
</head>
<body data-state="idle">

<header>
  <b>JARVIS</b>
  <span class="link"><span id="dot" class="dot"></span><span id="linkText">offline</span></span>
</header>

<main>
  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="halo-g">
          <stop offset="55%" stop-color="var(--accent)" stop-opacity="0"/>
          <stop offset="82%" stop-color="var(--accent)" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="core-g">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="38%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="70%" stop-color="var(--accent)" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- outer glow -->
      <circle class="halo" cx="50" cy="50" r="50" fill="url(#halo-g)"/>

      <!-- the eight coils, as one dashed band -->
      <g class="coil" filter="url(#glow)">
        <circle cx="50" cy="50" r="29.05" fill="none" stroke="var(--accent)"
                stroke-width="11.90" stroke-dasharray="18.25 4.56" opacity="0.9"/>
      </g>

      <!-- a comet that sweeps the band while he is working -->
      <g class="sweep">
        <circle cx="50" cy="50" r="29.05" fill="none" stroke="#ffffff"
                stroke-width="11.90" stroke-linecap="round"
                stroke-dasharray="20.53 182.53" opacity="0.5"/>
      </g>

      <!-- outer rim and inner ring -->
      <circle class="rim" cx="50" cy="50" r="37.2" fill="none"
              stroke="var(--accent)" stroke-width="2.4" opacity="0.75" filter="url(#glow)"/>
      <circle class="inner" cx="50" cy="50" r="19.1" fill="none"
              stroke="var(--accent)" stroke-width="2.6" opacity="0.9" filter="url(#glow)"/>

      <!-- a wave leaving the core while he speaks -->
      <circle class="wave" cx="50" cy="50" r="8" fill="none"
              stroke="var(--accent)" stroke-width="1.6" opacity="0"/>

      <!-- the white-hot core -->
      <circle class="bloom" cx="50" cy="50" r="14.2" fill="url(#core-g)"/>
      <circle class="core" cx="50" cy="50" r="7.5" fill="#ffffff" opacity="0.95"/>
    </svg>
    <div class="caption" id="caption">idle</div>
    <div class="note" id="note"></div>
  </div>

  <div id="log" aria-live="polite"></div>
  <div id="routines"></div>
  <button id="forget" class="ghost" hidden>forget this phone</button>

  <div class="talk-wrap">
    <button id="talk" data-armed="0">tap to talk</button>
  </div>
</main>

<section id="pair" hidden>
  <h1>Pair this phone</h1>
  <p class="hint">The six-digit code is printed on the JARVIS console on your desk.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
  <input id="deviceName" maxlength="40" placeholder="name this phone">
  <button id="pairGo">Pair</button>
  <div id="pairNote"></div>
</section>

<!-- Pinned so a CDN update can never change what runs on the phone. vad-web hands
     onSpeechEnd a Float32Array of 16 kHz mono, which is exactly what Whisper wants. -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.22/dist/bundle.min.js"></script>
<script>
"use strict";
const VAD_ASSETS = "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.22/dist/";
const ORT_ASSETS = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/";

const el = (id) => document.getElementById(id);
const ui = {
  body: document.body, dot: el("dot"), linkText: el("linkText"), caption: el("caption"),
  note: el("note"), log: el("log"), routines: el("routines"), talk: el("talk"),
  pair: el("pair"), code: el("code"), deviceName: el("deviceName"),
  pairGo: el("pairGo"), pairNote: el("pairNote"), forget: el("forget")
};

const app = {
  audioCtx: null,      // created inside the tap handler; iOS is silent otherwise
  vad: null,           // MicVAD, built on first tap so permission is asked then
  armed: false,
  audioWs: null,
  stateWs: null,
  stateTries: 0,
  audioTries: 0,
  voice: null,
  busy: false,
  replyOpen: false,
  suspended: false
};

/* ---------------------------------------------------------------- small helpers */
function setState(state) {
  const known = ["idle", "listening", "thinking", "speaking", "paused"];
  const value = known.indexOf(state) >= 0 ? state : "idle";
  ui.body.dataset.state = value;
  document.documentElement.style.setProperty("--accent", `var(--${value})`);
  ui.caption.textContent = value === "thinking" ? "working" : value;
}
function setLink(up, text) {
  ui.dot.classList.toggle("on", !!up);
  ui.linkText.textContent = text || (up ? "linked" : "offline");
}
function say(text) { ui.note.textContent = text || ""; }

function addLine(kind, text) {
  if (!text) return null;
  const node = document.createElement("div");
  node.className = "line " + kind;
  node.textContent = text;
  ui.log.appendChild(node);
  while (ui.log.children.length > 12) ui.log.removeChild(ui.log.firstChild);
  ui.log.scrollTop = ui.log.scrollHeight;
  return node;
}
function appendReply(text) {
  const last = ui.log.lastElementChild;
  if (app.replyOpen && last && last.classList.contains("him")) {
    last.textContent = (last.textContent + " " + text).trim();
    ui.log.scrollTop = ui.log.scrollHeight;
  } else {
    addLine("him", text);
    app.replyOpen = true;
  }
}

async function api(path, body) {
  const options = { credentials: "same-origin", headers: { "Content-Type": "application/json" } };
  if (body !== undefined) { options.method = "POST"; options.body = JSON.stringify(body); }
  const response = await fetch(path, options);
  let data = {};
  try { data = await response.json(); } catch (err) { data = {}; }
  return { status: response.status, data: data };
}

/* ------------------------------------------------------------------- speaking */
function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const british = voices.filter(v => /en[-_]GB/i.test(v.lang));
  const male = british.find(v => /daniel|arthur|george|male|oliver/i.test(v.name));
  app.voice = male || british[0] || voices.find(v => /^en/i.test(v.lang)) || null;
}
function speak(text) {
  if (!text || !window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);
  if (app.voice) { utterance.voice = app.voice; utterance.lang = app.voice.lang; }
  utterance.rate = 1.0; utterance.pitch = 0.95;
  try { speechSynthesis.speak(utterance); } catch (err) { /* nothing to be done */ }
}
/* iOS only allows speech that descends from a user gesture; this primes it. */
function primeSpeech() {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const silent = new SpeechSynthesisUtterance(" ");
    silent.volume = 0;
    speechSynthesis.speak(silent);
  } catch (err) { /* ignore */ }
  pickVoice();
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice;

/* ------------------------------------------------------------------- the wire */
function wsUrl(path) {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return scheme + "//" + location.host + path;
}

function connectState() {
  if (app.suspended || (app.stateWs && app.stateWs.readyState <= 1)) return;
  const socket = new WebSocket(wsUrl("/ws/state"));
  app.stateWs = socket;
  socket.onopen = () => { app.stateTries = 0; setLink(true, "linked"); };
  socket.onmessage = (event) => {
    const message = JSON.parse(event.data);
    if (message.type === "state") setState(message.state);
    if (message.type === "unpaired") showPairing("");
  };
  socket.onclose = () => {
    setLink(false, "offline");
    if (app.suspended) return;
    app.stateTries += 1;
    setTimeout(connectState, Math.min(1000 * app.stateTries, 8000));
  };
  socket.onerror = () => { try { socket.close(); } catch (err) { /* ignore */ } };
}

function connectAudio() {
  return new Promise((resolve, reject) => {
    if (app.audioWs && app.audioWs.readyState === 1) { resolve(app.audioWs); return; }
    const socket = new WebSocket(wsUrl("/ws/audio"));
    socket.binaryType = "arraybuffer";
    app.audioWs = socket;
    socket.onopen = () => { socket.send(JSON.stringify({ type: "hello" })); resolve(socket); };
    socket.onerror = () => reject(new Error("audio link failed"));
    socket.onclose = () => { if (app.audioWs === socket) app.audioWs = null; };
    socket.onmessage = (event) => onTurnMessage(JSON.parse(event.data));
  });
}

function onTurnMessage(message) {
  switch (message.type) {
    case "transcript":
      addLine("you", message.text); app.replyOpen = false; break;
    case "sentence":
      appendReply(message.text); speak(message.text); break;
    case "done":
      app.busy = false; app.replyOpen = false; say("");
      if (message.error) addLine("err", message.error);
      break;
    case "busy":
      app.busy = false; say(message.message || "Busy."); break;
    case "error":
      app.busy = false; addLine("err", message.message || "Something went wrong."); say(""); break;
    case "unpaired":
      showPairing("Pair this phone again."); break;
    default:
      break; /* ping / pong / ready */
  }
}

/* ------------------------------------------------------------------ the mouth */
/* Float32 [-1,1] at 16 kHz -> Int16 little-endian. The server does the reverse in
   one line and hands the array straight to Whisper: no codec, no ffmpeg. */
function toPcm16(samples) {
  const pcm = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    const clamped = Math.max(-1, Math.min(1, samples[i]));
    pcm[i] = clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff;
  }
  return pcm.buffer;
}

async function startListening() {
  if (!window.vad || !window.vad.MicVAD) {
    say("Speech detection could not load; check this phone's connection.");
    return false;
  }
  await connectAudio();
  if (!app.vad) {
    app.vad = await window.vad.MicVAD.new({
      baseAssetPath: VAD_ASSETS,
      onnxWASMBasePath: ORT_ASSETS,
      positiveSpeechThreshold: 0.6,
      minSpeechFrames: 4,
      redemptionFrames: 12,
      onSpeechStart: () => { say("listening"); },
      onVADMisfire: () => { say("that was too short, sir"); },
      onSpeechEnd: (audio) => { sendUtterance(audio); }
    });
  }
  app.vad.start();
  app.armed = true;
  ui.talk.dataset.armed = "1";
  ui.talk.textContent = "listening";
  say("speak when ready");
  return true;
}

function stopListening(message) {
  if (app.vad) { try { app.vad.pause(); } catch (err) { /* ignore */ } }
  app.armed = false;
  ui.talk.dataset.armed = "0";
  ui.talk.textContent = "tap to talk";
  say(message || "");
}

function sendUtterance(samples) {
  const socket = app.audioWs;
  if (!socket || socket.readyState !== 1) { say("the link dropped, sir"); return; }
  if (!samples || samples.length < 1600) { say("that was too short, sir"); return; }
  app.busy = true;
  say("sent " + (samples.length / 16000).toFixed(1) + " seconds");
  socket.send(toPcm16(samples));
  stopListening("");
}

/* ----------------------------------------------------------------- the button */
ui.talk.addEventListener("click", async () => {
  /* Everything that iOS ties to a gesture happens right here, synchronously
     first: the AudioContext, its resume(), and the speech primer. */
  try {
    if (!app.audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      app.audioCtx = new Ctx({ sampleRate: 16000 });
    }
    if (app.audioCtx.state === "suspended") app.audioCtx.resume();
  } catch (err) { /* a context is a nicety; the VAD makes its own too */ }
  primeSpeech();

  if (app.armed) { stopListening(""); return; }
  ui.talk.disabled = true;
  try {
    await startListening();
  } catch (err) {
    say("I couldn't reach the microphone, sir.");
    stopListening("");
  } finally {
    ui.talk.disabled = false;
  }
});

/* ---------------------------------------------------------------- the routines */
function drawRoutines(routines) {
  ui.routines.textContent = "";
  (routines || []).forEach((routine) => {
    const button = document.createElement("button");
    button.textContent = routine.name;
    button.addEventListener("click", async () => {
      primeSpeech();
      button.disabled = true;
      try {
        const answer = await api("/api/routine", { name: routine.name });
        if (answer.status === 401) { showPairing("Pair this phone again."); return; }
        if (answer.data.said) { appendReply(answer.data.said); speak(answer.data.said); }
        if (!answer.data.ok && !answer.data.said) addLine("err", "That routine did not run.");
        app.replyOpen = false;
      } catch (err) {
        addLine("err", "I couldn't reach the desk.");
      } finally {
        button.disabled = false;
      }
    });
    ui.routines.appendChild(button);
  });
}

/* Forgetting the phone here is the only way to revoke the cookie from the phone
   itself; without it an unpaired device means editing config.yaml at the desk. */
ui.forget.addEventListener("click", async () => {
  try { await api("/api/unpair", {}); } catch (err) { /* the cookie dies either way */ }
  ui.forget.hidden = true;
  showPairing("This phone was forgotten.");
});

/* ------------------------------------------------------------------- pairing */
function showPairing(message) {
  ui.pair.hidden = false;
  ui.forget.hidden = true;
  ui.pairNote.textContent = message || "";
  stopListening("");
  if (!ui.deviceName.value) ui.deviceName.value = guessName();
}
function guessName() {
  const agent = navigator.userAgent || "";
  if (/iPhone/i.test(agent)) return "iPhone";
  if (/iPad/i.test(agent)) return "iPad";
  if (/Android/i.test(agent)) return "Android phone";
  return "phone";
}
ui.pairGo.addEventListener("click", async () => {
  ui.pairGo.disabled = true;
  ui.pairNote.textContent = "";
  try {
    const answer = await api("/api/pair", {
      code: ui.code.value, device: ui.deviceName.value || guessName()
    });
    if (answer.data.ok) {
      ui.pair.hidden = true;
      ui.code.value = "";
      await boot();
    } else {
      ui.pairNote.textContent = answer.data.message || "Pairing failed.";
    }
  } catch (err) {
    ui.pairNote.textContent = "The desk did not answer.";
  } finally {
    ui.pairGo.disabled = false;
  }
});

/* ---------------------------------------------------------------------- boot */
async function boot() {
  try {
    const answer = await api("/api/session");
    if (!answer.data.paired) { showPairing(""); setLink(false, "not paired"); return; }
    ui.pair.hidden = true;
    ui.forget.hidden = false;
    setState(answer.data.state);
    drawRoutines(answer.data.routines);
    connectState();
  } catch (err) {
    setLink(false, "offline");
    say("The desk did not answer.");
  }
}

/* An iOS tab that is swiped away is suspended: sockets die quietly and the
   microphone must not stay armed. Tear down on hide, rebuild on show. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    app.suspended = true;
    stopListening("");
    [app.stateWs, app.audioWs].forEach((socket) => {
      try { if (socket) socket.close(); } catch (err) { /* ignore */ }
    });
    app.stateWs = null; app.audioWs = null;
    setLink(false, "asleep");
  } else {
    app.suspended = false;
    app.stateTries = 0;
    boot();
  }
});
window.addEventListener("pagehide", () => stopListening(""));

boot();
</script>
</body>
</html>
